<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Intranet-M-trica/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intranet Métrica</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      
      // Este script redireciona URLs de SPA no GitHub Pages
      // Quando uma rota como /agenda é acessada diretamente,
      // o GitHub Pages mostra 404, então este script redireciona
      // para a aplicação com a rota correta
      
      var pathSegmentsToKeep = 1; // Mantém /Intranet-M-trica/
      
      var l = window.location;
      var pathname = l.pathname;
      
      // Verifica se já estamos na página correta (evita loop)
      if (pathname.indexOf('/?/') === -1) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/~/g, ':').replace(/\u0026/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/\u0026/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
